name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Check tag and version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts').read_text()
          name = re.search(r'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', gradle).group(1)
          code = re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1)
          if os.environ['GITHUB_REF_NAME'] != 'v' + name:
              raise SystemExit('Tag must match versionName in app/build.gradle.kts')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'name={name}\ncode={code}\n')
          PY
      # Secrets: SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS,
      # SIGNING_KEY_PASSWORD. Gradle receives a temporary SIGNING_STORE_FILE path.
      - name: Decode signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/checkin-release.keystore"
      - name: Test and build release APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/checkin-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Verify signing certificate and create update manifest
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          apk="kaoyan-checkin-${VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          cert="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "04bdfa4e44d57c1e7ec9406cc84e5d6d5e26f77d180000658fef922523f7e51d" || { echo 'Signing certificate does not match the required identity' >&2; exit 1; }
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from urllib.parse import quote
          name = os.environ['VERSION_NAME']
          apk = Path(f'kaoyan-checkin-{name}.apk')
          manifest = {
              'versionCode': int(os.environ['VERSION_CODE']),
              'versionName': name,
              'apkUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{quote(os.environ['GITHUB_REF_NAME'], safe='')}/{quote(apk.name)}",
              'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'notes': f'考研打卡 {name} 版本更新，详细说明请查看 Release 页面。',
          }
          Path('update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "考研打卡 ${VERSION_NAME} Android 更新。"
          fi
          gh release upload "$GITHUB_REF_NAME" "kaoyan-checkin-${VERSION_NAME}.apk" update.json --clobber
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/checkin-release.keystore"
